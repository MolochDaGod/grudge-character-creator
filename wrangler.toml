# Grudge Character Creator — Cloudflare Worker config
# Serves model manifest from D1 at models.grudge-studio.com

name = "grudge-models-worker"
main = "worker/index.js"
compatibility_date = "2024-12-01"

# Custom domain (set up in Cloudflare dashboard)
# routes = [{ pattern = "models.grudge-studio.com/*", zone_name = "grudge-studio.com" }]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "grudge-models"
database_id = ""  # Fill after: npx wrangler d1 create grudge-models

# R2 bucket binding (optional — for direct upload from Worker)
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "grudge-assets"
