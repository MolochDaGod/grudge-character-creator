<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grudge Studio — Signing in</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Jost:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #070a12; color: #e8eaf6; font-family: 'Jost', sans-serif;
    }
    .box { text-align: center; max-width: 360px; padding: 24px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #2a3a5c; border-top-color: #6ee7b7;
      border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-family: 'Cinzel', serif; font-size: 1rem; color: #6ee7b7; letter-spacing: 1px; }
    p { color: #8fa3c7; font-size: .85rem; margin-top: 8px; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Completing sign-in…</h1>
    <p id="msg">Using existing Grudge ID / Discord session</p>
  </div>
  <script type="module">
    /** Fleet token keys shared with Warlords / id.grudge-studio.com */
    const FLEET_KEYS = [
      'grudge_token_persist',
      'grudge_auth_token',
      'grudge_session_token',
      'sso_token',
      'grudge_token',
    ];

    function storeFleetToken(token) {
      if (!token) return;
      for (const k of FLEET_KEYS) {
        try { localStorage.setItem(k, token); } catch { /* ignore */ }
      }
      try { sessionStorage.setItem('grudge_token', token); } catch { /* ignore */ }
    }

    const params = new URLSearchParams(location.search);
    // Also pick up hash handoff from id gateway (#sso_token=…)
    if (location.hash && location.hash.length > 1) {
      const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
      for (const [k, v] of hashParams) {
        if (!params.has(k)) params.set(k, v);
      }
    }
    const returnTo = params.get('return') || '/game/';
    const title = document.getElementById('title');
    const msg = document.getElementById('msg');
    const spinner = document.getElementById('spinner');

    function fail(text) {
      spinner.style.display = 'none';
      title.textContent = 'Sign-in failed';
      title.className = 'err';
      msg.textContent = text;
      setTimeout(() => { location.href = '/game/'; }, 2800);
    }

    async function bridgeLaunchToken(launchToken) {
      // Exchange launch/sso token → session JWT on canonical grudge-api (via Vercel rewrite)
      const exchange = await fetch('/api/auth/session/exchange', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: launchToken, audience: location.origin }),
      });

      let sessionToken = null;
      let profile = null;

      if (exchange.ok) {
        profile = await exchange.json();
        sessionToken = profile.token || profile.sessionToken || null;
      }

      // If exchange already returned a usable JWT, skip puter bridge
      if (sessionToken && sessionToken.split('.').length === 3) {
        storeFleetToken(sessionToken);
        if (profile?.grudgeId) localStorage.setItem('grudge_id', profile.grudgeId);
        if (profile?.username) localStorage.setItem('grudge_username', profile.username);
        return profile || { displayName: 'Player' };
      }

      // Bridge via puter device-link using exchange profile (legacy path)
      if (!profile?.grudgeId) {
        // Launch token itself may already be a session JWT
        storeFleetToken(launchToken);
        const me = await fetch('/api/auth/me', {
          headers: { Authorization: `Bearer ${launchToken}` },
        });
        if (me.ok) {
          const data = await me.json();
          const u = data.user || data;
          if (u.grudgeId) localStorage.setItem('grudge_id', u.grudgeId);
          if (u.username) localStorage.setItem('grudge_username', u.username);
          return u;
        }
        throw new Error(exchange.ok ? 'No grudgeId from exchange' : `Token exchange failed (${exchange.status})`);
      }

      const auth = await fetch('/api/auth/puter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          puterId: `grudge_${profile.grudgeId}`,
          puterUuid: `grudge_${profile.grudgeId}`,
          displayName: profile.displayName || profile.username,
        }),
      });
      if (!auth.ok) throw new Error('Session bridge failed');
      const data = await auth.json();
      const token = data.token || data.sessionToken;
      if (!token) throw new Error('No session token');
      storeFleetToken(token);
      if (profile.grudgeId) localStorage.setItem('grudge_id', profile.grudgeId);
      if (profile.username) localStorage.setItem('grudge_username', profile.username);
      return profile;
    }

    try {
      const launchToken = params.get('grudge_token') || params.get('sso_token') || params.get('token');

      if (launchToken) {
        const profile = await bridgeLaunchToken(launchToken);
        title.textContent = `Welcome, ${profile.displayName || profile.username || 'Player'}`;
        msg.textContent = 'Redirecting to Grudge6…';
        // Strip tokens from URL
        history.replaceState({}, '', location.pathname + (returnTo.startsWith('/') ? '' : ''));
        setTimeout(() => { location.href = returnTo; }, 500);
      } else {
        // Already signed in?
        const existing = localStorage.getItem('grudge_token_persist')
          || localStorage.getItem('grudge_auth_token')
          || localStorage.getItem('sso_token');
        if (existing) {
          location.href = returnTo;
        } else {
          fail('No auth token received — try Discord or Grudge ID again');
        }
      }
    } catch (err) {
      fail(err.message || 'Unknown error');
    }
  </script>
</body>
</html>
